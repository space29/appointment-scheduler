# Optional local telemetry viewer and metrics history. Combine with compose.yaml.
services:
  api:
    environment:
      Observability__OtlpEndpoint: http://dashboard:18890
      AllowedHosts: localhost;127.0.0.1;api
  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.1
    environment:
      ASPNETCORE_URLS: http://+:18888
      ASPIRE_DASHBOARD_OTLP_ENDPOINT_URL: http://+:18889
      ASPIRE_DASHBOARD_OTLP_HTTP_ENDPOINT_URL: http://+:18890
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:4318:18890"
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_started
